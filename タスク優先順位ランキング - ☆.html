<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">


<h1 class="title">🏆タスク優先順位ランキング</h1>


<style>

.title {
    color: white !important;
}


.h2 {
    color: white !important;
}


.edit {
    width: auto;
    margin-left: 8px;
    padding: 8px 12px;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 7px;
    cursor: pointer;
}

.edit:hover {
    background: #1d4ed8;
}





.deadline {
    margin-top: 6px;
    font-size: 14px;
    color: #2563eb;
    font-weight: bold;
}



.stars {
    color: #d4a017;
    margin-left: 12px;
    letter-spacing: 2px;
    font-size: 18px;
}




    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: "Noto Sans JP", sans-serif;
        background: black;
        color: #222;
    }

    .container {
        max-width: 800px;
        margin: 30px auto;
        padding: 20px;
    }

    h1 {
        text-align: center;
        margin-bottom: 25px;
    }

   
    .rules {
        background: white;
        border-radius: 15px;
        padding: 20px;
        margin-bottom: 20px;
        box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }

    .rules h2 {
        margin-top: 0;
        font-size: 20px;
    }

    .rules h3 {
        margin-bottom: 5px;
        color: #2563eb;
    }

    .rules ul {
        margin-top: 8px;
        padding-left: 25px;
    }

    .rules li {
        margin: 5px 0;
    }

   
    .input-area {
        background: white;
        border-radius: 15px;
        padding: 20px;
        box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }

    label {
        display: block;
        font-weight: bold;
        margin-top: 15px;
    }

    input,
    select {
        width: 100%;
        padding: 12px;
        margin-top: 7px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 16px;
    }

    .add-button {
        width: 100%;
        padding: 14px;
        margin-top: 20px;
        border: none;
        border-radius: 10px;
        background: #2563eb;
        color: white;
        font-size: 17px;
        font-weight: bold;
        cursor: pointer;
    }

    .add-button:hover {
        background: #1d4ed8;
    }

 
    .ranking {
        margin-top: 25px;
    }

    .ranking h2 {
        margin-bottom: 15px;
    }

    .task {
        display: flex;
        align-items: center;
        background: white;
        margin-bottom: 12px;
        padding: 15px;
        border-radius: 12px;
        box-shadow: 0 2px 7px rgba(0,0,0,0.08);
    }

    .rank {
        width: 65px;
        font-size: 22px;
        font-weight: bold;
        text-align: center;
    }

    .task-info {
        flex: 1;
    }

    .task-name {
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 7px;
    }

    .score {
        font-weight: bold;
        color: #dc2626;
    }

    .detail {
        color: #666;
        font-size: 14px;
    }

    .delete {
        width: auto;
        margin-left: 10px;
        padding: 8px 12px;
        background: #ef4444;
        color: white;
        border: none;
        border-radius: 7px;
        cursor: pointer;
    }

    .delete:hover {
        background: #dc2626;
    }

    .empty {
        text-align: center;
        color: #777;
        background: white;
        padding: 25px;
        border-radius: 12px;
    }

    .gold {
        color: #d4a017;
    }

    .silver {
        color: #777;
    }

    .bronze {
        color: #a65f2b;
    }
</style>
</head>

<body>

<div class="container">

    <!-- ルール -->
    <div class="rules">

        <h2>📖判定ルール（重要度×緊急度＝優先順位）</h2>

        <h3>重要度 ＝ そのタスクをやらないことで生じる影響の大きさ</h3>

        <ul>
            <li>会社の信用・評判</li>
            <li>売上・利益</li>
            <li>顧客への影響</li>
            <li>法令・契約上の問題</li>
            <li>経営上の重要性</li>
        </ul>

        <h3>緊急度 ＝ 時間的な余裕のなさ</h3>

        <ul>
            <li>締切が今日</li>
            <li>期限が明日</li>
            <li>すぐ対応しないと問題になる</li>
            <li>待ち時間がほとんどない</li>
        </ul>

    </div>


    <!-- 入力 -->
    <div class="input-area">

        <label for="taskName">
            📝 タスク（ここに入力）
        </label>

        <input
            id="taskName"
            type="text"
            placeholder="例：重要顧客への提案書を作成する"
        >




<label for="deadline">
    📅 締め切り日
</label>

<input
    id="deadline"
    type="date"
>






        <label for="importance">
            ⚠️ 重要度（５が優先、１が後回し）
        </label>

        <select id="importance">

          
            <option value="5" selected>5 - 会社・顧客・業務への影響が非常に大きい</option>
            <option value="4">4 - 影響が大きい </option>
            <option value="3">3 - 通常程度</option>
            <option value="2">2 - 影響は小さい</option>
            <option value="1">1 - ほとんど影響がない</option>

        </select>


        <label for="urgency">
            ⏰ 緊急度（５が優先、１が後回し）
        </label>

        <select id="urgency">

           
            <option value="5" selected>5 - 今すぐ・本日中に対応</option>
            <option value="4">4 - 明日までに対応</option>
            <option value="3">3 - 数日以内に対応</option>
            <option value="2">2 - 1週間程度の余裕あり</option>
            <option value="1">1 - 期限にかなり余裕がある</option>

        </select>


        <button class="add-button" onclick="addTask()">
            ＋ タスクを追加
        </button>

    </div>


    <!-- ランキング -->
    <div class="ranking">

<h2 class="h2">🏳️優先順位ランキング</h2>


        <div id="taskList">
            <div class="empty">
                タスクを追加すると、優先順位が表示されます。
            </div>
        </div>

    </div>

</div>


<script>

    let tasks = [];
let editingTask = null;

  
    function addTask() {

        const taskName =
            document.getElementById("taskName").value.trim();

        const importance =
            Number(document.getElementById("importance").value);

        const urgency =
            Number(document.getElementById("urgency").value);



        const deadline =
            document.getElementById("deadline").value;


        if (taskName === "") {

            alert("タスクを入力してください。");

            return;
        }


       
        const score = importance * urgency;

const taskData = {
    name: taskName,
    importance: importance,
    urgency: urgency,
    score: score,
    deadline: deadline
};

if (editingTask) {
   
    Object.assign(editingTask, taskData);
    editingTask = null;

    document.querySelector(".add-button").textContent =
        "＋ タスクを追加";
} else {
   
    tasks.push(taskData);
}



     


       
        document.getElementById("taskName").value = "";
document.getElementById("deadline").value = "";


       
        renderTasks();

    }


   
    function renderTasks() {

        const list =
            document.getElementById("taskList");


     
        tasks.sort(function(a, b) {

            return b.score - a.score;

        });


        list.innerHTML = "";


        if (tasks.length === 0) {

            list.innerHTML = `
                <div class="empty">
                    タスクを追加すると、優先順位が表示されます。
                </div>
            `;

            return;
        }


       
        const top10 = tasks.slice(0, 10);


        top10.forEach(function(task, index) {

            const rank = index + 1;


            const stars = "★".repeat(Math.round(task.score / 5))
             + "☆".repeat(5 - Math.round(task.score / 5));

            let rankClass = "";

            if (rank === 1) {
                rankClass = "gold";
            }

            else if (rank === 2) {
                rankClass = "silver";
            }

            else if (rank === 3) {
                rankClass = "bronze";
            }


            const div =
                document.createElement("div");

            div.className = "task";


            div.innerHTML = `

                <div class="rank ${rankClass}">
                    ${rank}位
                </div>

                <div class="task-info">

                    <div class="task-name">
                        ${escapeHTML(task.name)}
                    </div>

                    <div class="detail">

                       ⚠️重要度：${task.importance}/5　
                       ⏰緊急度：${task.urgency}/5

                    </div>


<div class="deadline">
    📅 締め切り：
    ${task.deadline
        ? escapeHTML(task.deadline.replace(/-/g, "/"))
        : "未設定"}
</div>




                   <div class="score">
    優先度スコア：${task.score}
    <span class="stars">${stars}</span>


                </div>

<button
    class="edit"
    onclick="editTask(${tasks.indexOf(task)})">
    編集
</button>

<button
    class="delete"
    onclick="deleteTask(${tasks.indexOf(task)})">
    削除
</button>
            `;


            list.appendChild(div);

        });

    }


    function editTask(index) {
    const task = tasks[index];

    if (!task) return;

    document.getElementById("taskName").value =
        task.name;

    document.getElementById("importance").value =
        task.importance;

    document.getElementById("urgency").value =
        task.urgency;

    document.getElementById("deadline").value =
        task.deadline || "";

    editingTask = task;

    document.querySelector(".add-button").textContent =
        "✓ 変更を保存";

    document.querySelector(".input-area").scrollIntoView({
        behavior: "smooth",
        block: "start"
    });
}



function deleteTask(index) {

    tasks.splice(index, 1);

    renderTasks();

}


   
    function escapeHTML(text) {

        const div =
            document.createElement("div");

        div.textContent = text;

        return div.innerHTML;

    }


</script>

</body>
</html>
